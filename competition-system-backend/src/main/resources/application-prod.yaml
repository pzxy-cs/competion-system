spring:
  datasource:
    url: jdbc:mysql://prod_host:3306/competition_db?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false
    username: prod_user
    password: prod_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000